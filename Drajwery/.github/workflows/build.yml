name: Build + testy na emulatorze
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
        env: { TOMTOM_KEY: "${{ secrets.TOMTOM_KEY }}", CONTACT_EMAIL: "${{ secrets.CONTACT_EMAIL }}" }
      - uses: actions/upload-artifact@v4
        with: { name: Drajwery-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raport-testow-jednostkowych, path: app/build/reports/tests/ }

  emulator:
    runs-on: ubuntu-latest        # sztuczny telefon: emulator Pixel 6, Android 14, uruchamiany w chmurze
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Włącz KVM (przyspieszenie emulatora)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testy na emulatorze (UI + jazda z symulowanym GPS)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest
            mkdir -p shots && adb pull /sdcard/Android/data/pl.example.trasa/files/. shots/ || true
            adb exec-out screencap -p > shots/ekran-koncowy.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zrzuty-ekranu-z-emulatora, path: shots/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raport-testow-emulatora, path: app/build/reports/androidTests/ }
